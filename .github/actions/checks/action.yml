name: checks
description: Install, lint, typecheck, docs check, tests and a production-build smoke test
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
    - run: npm run lint
      shell: bash
    - run: npm run typecheck
      shell: bash
    - run: npm run docs:check
      shell: bash
    - run: npm test
      shell: bash
    - run: npm run test:e2e
      shell: bash
    - name: Smoke test the production build
      shell: bash
      env:
        PGPASSWORD: eshop
        DATABASE_URL: postgres://eshop:eshop@localhost:5432/smoke
        PORT: '3100'
      run: |
        set -euo pipefail
        npm run build
        test -f dist/main.js
        psql -h localhost -U eshop -d eshop -c 'CREATE DATABASE smoke'
        OTEL_TRACES_EXPORTER=console node --import ./dist/instrumentation.mjs dist/main.js > smoke.log 2>&1 &
        pid=$!
        trap 'rc=$?; [ "$rc" -eq 0 ] || cat smoke.log; kill "$pid" 2>/dev/null || true' EXIT
        up=0
        for _ in $(seq 1 30); do
          if curl -fs http://localhost:3100/health > /dev/null; then up=1; break; fi
          sleep 1
        done
        [ "$up" -eq 1 ] || { echo "health check timed out"; exit 1; }
        health=$(curl -sS -w '\n%{http_code}' http://localhost:3100/health)
        echo "$health"
        [ "${health##*$'\n'}" = "200" ] || { echo "health not 200"; exit 1; }
        [[ "$health" == *'"ok"'* ]] || { echo "health body lacks ok"; exit 1; }
        products=$(curl -fsS http://localhost:3100/catalog/products)
        [[ "$products" == *sku* ]] || { echo "catalog check failed"; exit 1; }
        span=0
        for _ in $(seq 1 10); do
          if grep -q "GET /health" smoke.log; then span=1; break; fi
          sleep 1
        done
        [ "$span" -eq 1 ] || { echo "no GET /health span in smoke.log"; exit 1; }
