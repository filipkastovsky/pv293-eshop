name: main
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/filipkastovsky/pv293-eshop
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eshop
          POSTGRES_PASSWORD: eshop
          POSTGRES_DB: eshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checks

  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lab
    env:
      LAB_KUBECONFIG: ${{ secrets.LAB_KUBECONFIG }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - name: Check for lab kubeconfig
        id: gate
        run: |
          if [ -n "$LAB_KUBECONFIG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LAB_KUBECONFIG not set — nothing deployed"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        name: Set up kubeconfig
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$LAB_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - if: steps.gate.outputs.enabled == 'true'
        name: Roll out
        run: |
          kubectl -n pv293-eshop set image deployment/eshop "eshop=${IMAGE}:${TAG}"
          kubectl -n pv293-eshop rollout status deployment/eshop --timeout=120s
